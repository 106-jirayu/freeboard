<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Environment Dashboard (iot-106)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 8px; }
    .header p { color: #94a3b8; font-size: 0.95rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; text-align: center; }
    .card h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
    .card .value { font-size: 1.8rem; font-weight: bold; color: #f8fafc; }
    .card .unit { font-size: 0.9rem; color: #64748b; }

    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; font-weight: bold; font-size: 0.9rem; margin-top: 6px; }
    .status-normal { background: #065f46; color: #34d399; }
    .status-warning { background: #991b1b; color: #f87171; }

    .chart-card { background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
    .footer-info { text-align: center; margin-top: 16px; font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Smart Environment Dashboard</h1>
      <p>Real-time Monitoring System (Database: iot-106)</p>
    </div>

    <!-- แสดงผล 6 คอลัมน์ -->
    <div class="cards">
      <div class="card">
        <h3>อุณหภูมิ</h3>
        <div class="value" id="temp" style="color: #f87171;">--</div>
        <div class="unit">°C</div>
      </div>
      <div class="card">
        <h3>ความชื้น</h3>
        <div class="value" id="hum" style="color: #38bdf8;">--</div>
        <div class="unit">%</div>
      </div>
      <div class="card">
        <h3>แสงสว่าง</h3>
        <div class="value" id="light" style="color: #facc15;">--</div>
        <div class="unit">lux</div>
      </div>
      <div class="card">
        <h3>ก๊าซ CO2</h3>
        <div class="value" id="co2" style="color: #a78bfa;">--</div>
        <div class="unit">ppm</div>
      </div>
      <div class="card">
        <h3>สถานะระบบ</h3>
        <div id="status" class="status-badge status-normal">--</div>
      </div>
      <div class="card">
        <h3>เวลาอัปเดต</h3>
        <div class="value" id="time" style="font-size: 1rem; margin-top: 10px;">--:--:--</div>
      </div>
    </div>

    <div class="chart-card">
      <canvas id="realtimeChart" height="100"></canvas>
    </div>

    <div class="footer-info">
      อัปเดตข้อมูลอัตโนมัติจาก Firebase Realtime Database (iot-106)
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ตั้งค่า URL เชื่อมต่อ Database iot-106
    const firebaseConfig = {
      databaseURL: "https://iot-106-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Chart.js Setup
    const ctx = document.getElementById('realtimeChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'อุณหภูมิ (°C)', borderColor: '#f87171', data: [], tension: 0.3 },
          { label: 'ความชื้น (%)', borderColor: '#38bdf8', data: [], tension: 0.3 },
          { label: 'ก๊าซ CO2 (ppm)', borderColor: '#a78bfa', data: [], tension: 0.3, yAxisID: 'y1' }
        ]
      },
      options: {
        responsive: true,
        scales: {
          y: { type: 'linear', position: 'left', grid: { color: '#334155' } },
          y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false } },
          x: { grid: { color: '#334155' } }
        },
        plugins: { legend: { labels: { color: '#f8fafc' } } }
      }
    });

    // ฟังค่า Realtime จาก /latest
    onValue(ref(db, 'latest'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('temp').innerText = data.temperature.toFixed(1);
        document.getElementById('hum').innerText = data.humidity.toFixed(1);
        document.getElementById('light').innerText = data.light.toFixed(0);
        document.getElementById('co2').innerText = data.co2.toFixed(0);

        const statusEl = document.getElementById('status');
        statusEl.innerText = data.status;
        statusEl.className = 'status-badge ' + (data.status === 'Normal' ? 'status-normal' : 'status-warning');

        if (data.timestamp) {
          const d = new Date(data.timestamp);
          document.getElementById('time').innerText = d.toLocaleTimeString();
        }
      }
    });

    // ฟังค่า Realtime จาก /history แสดงกราฟ 15 ค่าล่าสุด
    onValue(ref(db, 'history'), (snapshot) => {
      const historyData = snapshot.val();
      if (historyData) {
        const items = Object.values(historyData).slice(-15);
        chart.data.labels = items.map(item => new Date(item.timestamp).toLocaleTimeString());
        chart.data.datasets[0].data = items.map(item => item.temperature);
        chart.data.datasets[1].data = items.map(item => item.humidity);
        chart.data.datasets[2].data = items.map(item => item.co2);
        chart.update();
      }
    });
  </script>
</body>
</html>
